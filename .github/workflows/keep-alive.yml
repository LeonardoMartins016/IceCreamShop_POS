name: Keep Alive — Render

on:
  schedule:
    # A cada 14 minutos, das 10h às 23h UTC e 0h-1h UTC (= 7h às 22h59 BRT)
    - cron: "*/14 10-23,0-1 * * *"
  workflow_dispatch: # Permite executar manualmente também

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server
        run: |
          echo "🏓 Pinging server at $(date -u '+%Y-%m-%d %H:%M:%S UTC')..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ secrets.RENDER_URL }}/api/health")
          echo "Response status: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Server is alive!"
          else
            echo "⚠️ Server returned status $RESPONSE"
          fi
